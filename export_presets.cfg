; Export presets. Committed, because a dedicated server that is built by hand
; each time is a dedicated server that is eventually built wrong — and "wrong"
; here means a build whose fingerprint does not match its own clients.
;
; The server presets set the custom feature `dedicated_server`, which is what
; `ServerBoot.wanted()` reads: a build made to be a server needs no `--server`
; flag. The same flag still works on an ordinary build of the game, so a source
; checkout can run one without exporting anything.
;
; Building them needs the export templates for this exact Godot version:
;
;   godot --headless --path . --export-release "Server (Linux)"  build/thepit-server
;   godot --headless --path . --export-release "Server (Windows)" build/thepit-server.exe
;
; A server export omits nothing. It carries the whole game, sprites and all,
; because it IS the game with its presentation turned off — see
; docs/SERVER.md, "Why it is the game and not a separate program". Godot's
; dedicated-server export mode already strips the parts that need a GPU.

[preset.0]

name="Server (Linux)"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=true
custom_features="dedicated_server"
export_filter="all_resources"
include_filter=""
exclude_filter="test/*, tools/*, docs/*, addons/gdUnit4/*, addons/AsepriteWizard/*, addons/godot_mcp/*"
export_path="build/thepit-server"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=false
texture_format/etc2_astc=false

[preset.1]

name="Server (Windows)"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=true
custom_features="dedicated_server"
export_filter="all_resources"
include_filter=""
exclude_filter="test/*, tools/*, docs/*, addons/gdUnit4/*, addons/AsepriteWizard/*, addons/godot_mcp/*"
export_path="build/thepit-server.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=false
texture_format/etc2_astc=false
; The CONSOLE wrapper, always, for a server. The ordinary Windows executable is
; a GUI-subsystem app: started from a terminal it attaches to no console and
; prints nothing — which for a server means no log and no way to type a command.
application/console_wrapper_icon=""
debug/export_console_wrapper=1
